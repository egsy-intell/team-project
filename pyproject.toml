[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.23.14",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "matplotlib>=3.9",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "pytest>=8.3.5",
    "ruff>=0.14",
]
preso = [
    "pypandoc>=1.13",
    "pypandoc_binary>=1.13",
    "python-pptx>=1.0.2",
]

[tool.codespell]
skip = ".git,*.lock,.venv,__marimo__"
ignore-words-list = "nd,egsy,IST,Sampe"
